name: Better HY2 systemd recovery integration

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
  push:
    branches:
      - feat/account-bandwidth-controls
    paths:
      - '.github/workflows/systemd-recovery.yml'
      - 'scripts/test-systemd-recovery.sh'
      - 'scripts/test-cross-generation-migration.sh'
      - 'scripts/write-pair-manifest.py'
      - 'scripts/test-panel-admin-migration.py'
      - 'scripts/test-auth-isolation.py'

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { state: active, baseline: stable }
          - { state: migration, baseline: stable }
          - { state: stopped, baseline: stable }
          - { state: active, baseline: rc.1 }
          - { state: active, baseline: rc.3 }
          - { state: active, baseline: rc.4 }
          - { state: active, baseline: rc.7 }
          - { state: active, baseline: v2-stable }
    env:
      KERNEL_SHA: dc6b01106be3ca86c21cf7a9695e858b8145671e
      KERNEL_VERSION: v2.13.0-hui.6-dev
      PANEL_TEST_VERSION: v2.0.2-rc.1
    steps:
      - name: Require a real systemd VM
        run: |
          test "$(cat /proc/1/comm)" = systemd
          sudo -n systemctl show --property=SystemState

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: inputs.artifact == ''
        uses: actions/checkout@v7
        with:
          repository: GlareGlimmering/hysteria
          ref: ${{ env.KERNEL_SHA }}
          path: kernel-source
          persist-credentials: false
      - if: inputs.artifact == ''
        uses: actions/setup-go@v7
        with:
          go-version-file: kernel-source/app/go.mod
          cache: false
      - if: inputs.artifact == ''
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          package-manager-cache: false
      - if: inputs.artifact == ''
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Build the candidate pair
        if: inputs.artifact == ''
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build:prod
          git restore -- frontend/src/types/auto-imports.d.ts frontend/src/types/components.d.ts
          artifacts="$RUNNER_TEMP/hui-recovery-artifacts"
          mkdir "$artifacts"
          mv kernel-source "$RUNNER_TEMP/kernel-source"
          go build -trimpath -ldflags="-X h-ui/model/constant.Version=$PANEL_TEST_VERSION" -o "$artifacts/h-ui-linux-amd64" .
          (
            cd "$RUNNER_TEMP/kernel-source"
            test "$(git rev-parse HEAD)" = "$KERNEL_SHA"
            go build -buildvcs=false -trimpath -ldflags="-X github.com/apernet/hysteria/app/v2/cmd.appVersion=$KERNEL_VERSION -X github.com/apernet/hysteria/app/v2/cmd.appCommit=$KERNEL_SHA" -o "$artifacts/hysteria-linux-amd64" ./app
          )
          python3 scripts/write-pair-manifest.py "$artifacts" "$PANEL_TEST_VERSION" "$GITHUB_SHA" "$KERNEL_VERSION" "$KERNEL_SHA"
          (cd "$artifacts" && sha256sum h-ui-linux-amd64 hysteria-linux-amd64 HY2-PAIR.json > SHA256SUMS)
          HUI_PAIR_TEST_PANEL="$artifacts/h-ui-linux-amd64" \
          HUI_PAIR_TEST_KERNEL="$artifacts/hysteria-linux-amd64" \
          HUI_PAIR_TEST_PANEL_VERSION="$PANEL_TEST_VERSION" \
          HUI_PAIR_TEST_PANEL_COMMIT="$GITHUB_SHA" \
          HUI_PAIR_TEST_KERNEL_COMMIT="$KERNEL_SHA" \
          go test ./upgrade -run '^TestPairPreflightCompiledArtifacts$' -count=1 -v

      - name: Download the exact release candidates
        if: inputs.artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/hui-recovery-artifacts

      - name: Fetch and verify the rollback fixtures
        working-directory: ${{ runner.temp }}/hui-recovery-artifacts
        run: |
          version="${{ matrix.baseline }}"
          if [[ "$version" == v2-stable ]]; then
            base=https://github.com/GlareGlimmering/better-hy2/releases/download/v2.0.1
            curl -fsSL --retry 3 -o old-panel "$base/h-ui-linux-amd64"
            curl -fsSL --retry 3 -o old-kernel "$base/hysteria-linux-amd64"
            panel_hash=f9d834591f1b88b21391a39ea3ad88de481882b78d56ba6ae43449e344b7fd86
            kernel_hash=f8cf6f7f5691e7eec1ef3f7392939e24788c3088378008ad1e17ca7e53bc42af
          elif [[ "$version" == rc.1 || "$version" == rc.3 || "$version" == rc.4 || "$version" == rc.7 ]]; then
            base="https://github.com/GlareGlimmering/better-hy2/releases/download/v1.1.0-$version"
            curl -fsSL --retry 3 -o old-panel "$base/h-ui-linux-amd64"
            curl -fsSL --retry 3 -o old-kernel "$base/hysteria-linux-amd64"
            panel_hash=d7e7666c920b174d2d8902e84eb40d206171d9522e1590a092d4ad3f20800a35
            if [[ "$version" == rc.3 ]]; then
              panel_hash=550b4b04bd039b7e0a918dfb72c661fce0aad92059ac946fffcda9a50dd92530
            elif [[ "$version" == rc.4 ]]; then
              panel_hash=3b0d4d290157461430593804a0eb1fb25a4f24363ce3b5dd23a6e3835fe25eb6
            elif [[ "$version" == rc.7 ]]; then
              panel_hash=298126b7a19e234372073c50d5179f61e37cd522a11932dd038a9ef40ce33d87
            fi
            kernel_hash=f8cf6f7f5691e7eec1ef3f7392939e24788c3088378008ad1e17ca7e53bc42af
          else
            curl -fsSL --retry 3 -o old-panel https://github.com/GlareGlimmering/better-hy2/releases/download/v1.0.0/h-ui-linux-amd64
            curl -fsSL --retry 3 -o old-kernel https://github.com/GlareGlimmering/hysteria/releases/download/v2.13.0-hui.4/hysteria-linux-amd64-v2.13.0-hui.4
            panel_hash=2323bf6d838a48f56d3c77a1b45bf7926be1ec04db0c905352b65bed24f2bd0f
            kernel_hash=f1577bff290f5591a651b88596103045390581a6c0a6e999611cab8baa653d9e
          fi
          if [[ -f SHA256SUMS ]]; then
            sha256sum --check SHA256SUMS
          else
            sha256sum h-ui-linux-amd64 hysteria-linux-amd64 > SHA256SUMS
          fi
          printf '%s  %s\n' "$panel_hash" old-panel "$kernel_hash" old-kernel >> SHA256SUMS
          sha256sum -c SHA256SUMS
          chmod 0755 old-panel old-kernel h-ui-linux-amd64 hysteria-linux-amd64

      - name: Exercise offline recovery
        run: sudo -n env HUI_DISPOSABLE_VM=1 GITHUB_ACTIONS=true bash scripts/test-systemd-recovery.sh "$RUNNER_TEMP/hui-recovery-artifacts" "${{ matrix.state }}" "${{ matrix.baseline }}"
