name: Better HY2 build and release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
      - "release-retry/v1.1.0-rc.1"
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  BINARY_NAME: h-ui-linux-amd64

jobs:
  build:
    name: Test and build Linux AMD64
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.release-tag.outputs.tag }}
      is-release-tag: ${{ steps.release-tag.outputs.match }}
      is-paired-tag: ${{ steps.release-tag.outputs.paired }}
      is-prerelease-tag: ${{ steps.release-tag.outputs.prerelease }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        id: release-tag
        shell: bash
        run: |
          release_tag=""
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/release-retry/v1.1.0-rc.1 ]]; then
            release_tag="${GITHUB_REF_NAME#release-retry/}"
            git checkout --detach "refs/tags/$release_tag"
          fi
          if [[ -n "$release_tag" ]]; then
            echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
            if [[ "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]; then
              echo "match=true" >> "${GITHUB_OUTPUT}"
              echo "prerelease=true" >> "${GITHUB_OUTPUT}"
              echo "paired=true" >> "${GITHUB_OUTPUT}"
            elif [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom\.[0-9]+-rc\.[0-9]+$ ]]; then
              echo "match=true" >> "${GITHUB_OUTPUT}"
              echo "prerelease=true" >> "${GITHUB_OUTPUT}"
            elif [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom\.[0-9]+$ ]]; then
              echo "match=true" >> "${GITHUB_OUTPUT}"
              echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            elif [[ "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "match=true" >> "${GITHUB_OUTPUT}"
              echo "prerelease=false" >> "${GITHUB_OUTPUT}"
            else
              echo "Invalid release tag: $release_tag" >&2
              exit 1
            fi
          else
            echo "match=false" >> "${GITHUB_OUTPUT}"
            echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node.js from frontend/package.json
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          package-manager-cache: false

      - name: Set up pnpm from frontend/package.json
        uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: frontend/package.json
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
          run_install: false

      - name: Report tool versions
        run: |
          go version
          node --version
          pnpm --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        working-directory: frontend
        run: pnpm run test:unit

      - name: Check frontend types
        working-directory: frontend
        run: pnpm exec vue-tsc --noEmit

      - name: Build production frontend
        working-directory: frontend
        run: pnpm run build:prod

      - name: Verify production frontend output
        shell: bash
        run: |
          test -s frontend/dist/index.html
          test -d frontend/dist/assets
          grep -Fq '<div id="app"></div>' frontend/dist/index.html

      - name: Verify embedded frontend asset graph
        run: go test ./frontend -run 'Test(ProductionFrontendIsEmbedded|EmbeddedProductionAssetReferences|EmbeddedUnderscoreChunksAreServed|AssetReferenceValidationDetectsMissingUnderscoreChunk)$' -count=1

      - name: Run Go tests
        run: go test ./...

      - name: Build static Linux AMD64 binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        shell: bash
        run: |
          mkdir -p build
          build_version="dev-${GITHUB_SHA::12}"
          release_tag="${{ steps.release-tag.outputs.tag }}"
          if [[ -n "$release_tag" ]]; then
            build_version="$release_tag"
          fi
          source="$PWD"
          if [[ "${{ steps.release-tag.outputs.paired }}" == "true" ]]; then
            source="$RUNNER_TEMP/hui-release-source"
            git clone --no-hardlinks --local . "$source"
            git -C "$source" checkout --detach "$(git rev-parse HEAD)"
            mkdir -p "$source/frontend/dist"
            cp -a frontend/dist/. "$source/frontend/dist/"
            test -z "$(git -C "$source" status --porcelain)"
          fi
          binary="$PWD/build/$BINARY_NAME"
          (
            cd "$source"
            go build -trimpath -ldflags="-s -w -X h-ui/model/constant.Version=$build_version" -o "$binary" .
          )
          if [[ "${{ steps.release-tag.outputs.paired }}" == "true" ]]; then
            go version -m "$binary" > "$RUNNER_TEMP/hui-build-info"
            grep -F "vcs.revision=$(git rev-parse HEAD)" "$RUNNER_TEMP/hui-build-info"
            grep -F 'vcs.modified=false' "$RUNNER_TEMP/hui-build-info"
          fi
          chmod +x "build/${BINARY_NAME}"
          cp install.sh build/install.sh
          chmod +x build/install.sh
          printf '%s\n' "${build_version}" > build/EXPECTED_VERSION

      - name: Verify binary and embedded frontend
        shell: bash
        run: |
          file "build/${BINARY_NAME}" | tee build/file-info.txt
          grep -Fq 'ELF 64-bit' build/file-info.txt
          grep -Fq 'statically linked' build/file-info.txt
          test "$(build/${BINARY_NAME} version)" = "Better HY2 version $(cat build/EXPECTED_VERSION)"
          grep -aFq '<div id="app"></div>' "build/${BINARY_NAME}"
          while IFS= read -r asset_path; do
            embedded_path="${asset_path#frontend/}"
            grep -aFq "${embedded_path}" "build/${BINARY_NAME}"
          done < <(find frontend/dist/assets -type f -name '_*' -print)

      - name: Refuse environment-specific release contamination
        shell: bash
        run: |
          known_node="$(printf 'TM_NET_%s' '1')"
          known_domain="$(printf 'host.%s%s.com' 'crosscloud' 'connect')"
          if grep -aEiq "${known_node}|${known_domain}" "build/${BINARY_NAME}"; then
            echo "Environment-specific outbound data is present in the release binary" >&2
            exit 1
          fi

      - name: Generate SHA-256 checksum
        working-directory: build
        shell: bash
        run: |
          sha256sum "${BINARY_NAME}" install.sh > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Check out the paired kernel
        if: steps.release-tag.outputs.paired == 'true'
        uses: actions/checkout@v7
        with:
          repository: GlareGlimmering/hysteria
          ref: 54a51aaac00fa53a1378e20f207d54f7ac8d2b7e
          path: kernel-source
          persist-credentials: false

      - name: Set up the kernel Go toolchain
        if: steps.release-tag.outputs.paired == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: kernel-source/app/go.mod
          cache: false

      - name: Build and verify the paired RC assets
        if: steps.release-tag.outputs.paired == 'true'
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          KERNEL_VERSION: v2.13.0-hui.5-dev
          PANEL_VERSION: ${{ steps.release-tag.outputs.tag }}
        shell: bash
        run: |
          kernel_sha=$(git -C kernel-source rev-parse HEAD)
          export PANEL_SHA=$(git rev-parse HEAD)
          (
            cd kernel-source
            go build -trimpath -ldflags="-X github.com/apernet/hysteria/app/v2/cmd.appVersion=$KERNEL_VERSION -X github.com/apernet/hysteria/app/v2/cmd.appCommit=$kernel_sha" -o ../build/hysteria-linux-amd64 ./app
          )
          python3 - "$kernel_sha" <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import sys

          def artifact(filename, version, commit):
              with (Path("build") / filename).open("rb") as binary:
                  digest = hashlib.file_digest(binary, "sha256").hexdigest()
              return {"version": version, "commit": commit, "sha256": digest}

          pair = {
              "panel": artifact("h-ui-linux-amd64", os.environ["PANEL_VERSION"], os.environ["PANEL_SHA"]),
              "kernel": artifact("hysteria-linux-amd64", os.environ["KERNEL_VERSION"], sys.argv[1]),
              "os": "linux",
              "arch": "amd64",
              "accountConsistency": 2,
              "accountBandwidth": 1,
          }
          Path("build/HY2-PAIR.json").write_text(json.dumps(pair, indent=2) + "\n")
          PYTHON
          HUI_PAIR_TEST_PANEL="$PWD/build/h-ui-linux-amd64" \
          HUI_PAIR_TEST_KERNEL="$PWD/build/hysteria-linux-amd64" \
          HUI_PAIR_TEST_PANEL_VERSION="$PANEL_VERSION" \
          HUI_PAIR_TEST_PANEL_COMMIT="$PANEL_SHA" \
          HUI_PAIR_TEST_KERNEL_COMMIT="$kernel_sha" \
          go test ./upgrade -run '^TestPairPreflightCompiledArtifacts$' -count=1 -v
          cd build
          sha256sum h-ui-linux-amd64 hysteria-linux-amd64 HY2-PAIR.json > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: h-ui-linux-amd64-${{ github.sha }}
          path: |
            build/h-ui-linux-amd64
            build/SHA256SUMS
            build/install.sh
            build/hysteria-linux-amd64
            build/HY2-PAIR.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  paired-recovery:
    needs: build
    if: needs.build.outputs.is-paired-tag == 'true'
    uses: ./.github/workflows/systemd-recovery.yml
    with:
      artifact: h-ui-linux-amd64-${{ github.sha }}

  release:
    name: Publish GitHub Release
    needs: [build, paired-recovery]
    if: >-
      always() && needs.build.result == 'success' &&
      needs.build.outputs.is-release-tag == 'true' &&
      (needs.build.outputs.is-paired-tag != 'true' || needs.paired-recovery.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.release-tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.build.outputs.release-tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: h-ui-linux-amd64-${{ github.sha }}
          path: release-assets

      - name: Verify downloaded checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS

      - name: Refuse to overwrite an existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_title="Better HY2 ${RELEASE_TAG}"
          release_args=(
            "${RELEASE_TAG}"
            "release-assets/${BINARY_NAME}"
            "release-assets/SHA256SUMS"
            --verify-tag
            --title "${release_title}"
          )
          if [[ "${{ needs.build.outputs.is-paired-tag }}" == "true" ]]; then
            release_args+=("release-assets/hysteria-linux-amd64" "release-assets/HY2-PAIR.json")
          else
            release_args+=("release-assets/install.sh")
          fi
          if [[ "${{ needs.build.outputs.is-prerelease-tag }}" == "true" ]]; then
            release_args+=(--prerelease --latest=false --notes-from-tag)
          else
            release_args+=(--latest --notes-from-tag)
          fi
          gh release create "${release_args[@]}"
